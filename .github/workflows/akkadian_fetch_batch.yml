name: Fetch Akkadian Grammar Batch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  fetch-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai python-dotenv

      - name: Fetch batch results
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python Akkadian/scripts/fetch_grammar_batch.py --status Akkadian/batch_status.json

      - name: Commit rules
        run: |
          if [ ! -s Akkadian/data/grammar_rules/rules.jsonl ]; then
            echo "No rules.jsonl generated; skipping commit."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f Akkadian/data/grammar_rules/rules.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "akkadian: update grammar rules from batch"
          git push
