# Trainer config for PleIAs/Baguettotron on Dakota RL (PrimeIntellect / prime-rl)

[model]
name_or_path = "PleIAs/Baguettotron"
revision = "main"
torch_dtype = "auto"

[model.lora]
enabled = true
r = 16
lora_alpha = 32
lora_dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[training]
algorithm = "grpo"
num_epochs = 3
per_device_train_batch_size = 8
gradient_accumulation_steps = 2
learning_rate = 5.0e-6
warmup_steps = 100
max_grad_norm = 1.0
ppo_epochs = 3
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
vf_coef = 0.5
ent_coef = 0.01
max_steps = 1000

[dataset]
train_file = "../dakota_rl_training/datasets/grammar_tasks_easy.jsonl"
validation_file = "../dakota_rl_training/datasets/grammar_tasks_easy.jsonl"
train_split = 0.8
val_split = 0.2
shuffle = true
seed = 42
min_confidence = 0.7

[curriculum]
enabled = true
strategy = "progressive"

[[curriculum.stages]]
name = "easy_tasks"
dataset = "../dakota_rl_training/datasets/grammar_tasks_easy.jsonl"
difficulty = "easy"
min_accuracy = 0.80
max_epochs = 1

[[curriculum.stages]]
name = "medium_tasks"
dataset = "../dakota_rl_training/datasets/grammar_tasks_medium.jsonl"
difficulty = "medium"
min_accuracy = 0.75
max_epochs = 1

[[curriculum.stages]]
name = "hard_tasks"
dataset = "../dakota_rl_training/datasets/grammar_tasks_hard.jsonl"
difficulty = "hard"
min_accuracy = 0.70
max_epochs = 1

[environment]
env_name = "DakotaGrammarEnv"
max_turns = 3
task_timeout = 60

[verifier]
use_toploc = true
checkpoint_frequency = 100
rollout_verification = true

[logging]
wandb_project = "dakota-rl-grammar"
wandb_entity = ""
log_interval = 10
eval_interval = 100
metrics = ["reward/mean", "reward/std", "char_accuracy", "affix_accuracy", "semantic_accuracy"]

[checkpointing]
output_dir = "./checkpoints"
save_steps = 200
save_total_limit = 3
save_optimizer_states = true
resume_from_checkpoint = ""

[inference]
temperature = 0.7
top_p = 0.9
max_new_tokens = 64
do_sample = true

[distributed]
enabled = true
backend = "nccl"
num_workers = 4
fsdp_enabled = false

