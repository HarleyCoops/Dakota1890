name = "adaption-dakota-qa-laguna-full-free"
model = "poolside/Laguna-XS.2"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
learning_rate = 1e-4

[sampling]
max_tokens = 768
enable_thinking = false

[[env]]
id = "harleycooper/adaption-dakota-qa"
args = { max_examples = -1, eval_fraction = 0.1, eval_examples = 256, prompt_field = "enhanced_prompt", seed = 1890 }

[eval]
interval = 10
num_examples = 64
rollouts_per_example = 1

[checkpoints]
interval = 25
keep_cloud = 2

[adapters]
interval = 25
keep_last = 2
